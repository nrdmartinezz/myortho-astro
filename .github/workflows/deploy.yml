name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload to cPanel
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Confirm environment origin
        run: |
          echo "target=${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}"
          echo "SITE_URL=$SITE_URL"
          echo "ALLOW_INDEXING=$ALLOW_INDEXING"
          if [ -z "$SITE_URL" ]; then
            echo "::error::SITE_URL is not set on this GitHub Environment (Settings → Environments)."
            exit 1
          fi

      - run: npm ci

      # Gate: a type error or malformed frontmatter must never reach the server.
      - run: npm run verify

      - name: Install PHPMailer
        run: composer install --no-dev --working-dir=public/api

      - run: npm run build

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Keeps anything the server owns that the build does not produce.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            cgi-bin/**

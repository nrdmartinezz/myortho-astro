<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thank you — {{site_name}}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #1c1c1c;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background-color: #f4f4f5; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 600px;
              width: 100%;
              background-color: #ffffff;
              border: 1px solid #e4e4e7;
            "
          >
            <tr>
              <td style="background-color: #18181b; padding: 24px 32px">
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 12px;
                    letter-spacing: 2px;
                    text-transform: uppercase;
                    color: #a1a1aa;
                  "
                >
                  {{site_name}}
                </p>
                <h1 style="margin: 0; font-size: 24px; font-weight: 600; color: #ffffff">
                  Thank you, {{name}}!
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px">
                <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6">
                  We received your message and a member of our team will be in touch soon, usually
                  the same business day.
                </p>
                <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6">
                  If you need immediate assistance, call us at
                  <a
                    href="tel:{{site_phone_href}}"
                    style="color: #18181b; font-weight: 600; text-decoration: none"
                    >{{site_phone}}</a
                  >.
                </p>
                <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #52525b">
                  — The {{site_name}} team
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

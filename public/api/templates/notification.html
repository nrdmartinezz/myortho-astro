<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{subject_line}}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #1c1c1c;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background-color: #f4f4f5; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 600px;
              width: 100%;
              background-color: #ffffff;
              border: 1px solid #e4e4e7;
            "
          >
            <tr>
              <td style="background-color: #18181b; padding: 24px 32px">
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 12px;
                    letter-spacing: 2px;
                    text-transform: uppercase;
                    color: #a1a1aa;
                  "
                >
                  {{site_name}}
                </p>
                <h1 style="margin: 0; font-size: 24px; font-weight: 600; color: #ffffff">
                  {{subject_line}}
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="padding: 8px 0; border-bottom: 1px solid #e4e4e7">
                      <strong
                        style="
                          display: block;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                          color: #71717a;
                        "
                        >Name</strong
                      >
                      <span style="font-size: 16px">{{name}}</span>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 8px 0; border-bottom: 1px solid #e4e4e7">
                      <strong
                        style="
                          display: block;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                          color: #71717a;
                        "
                        >Email</strong
                      >
                      <a href="mailto:{{email_raw}}" style="font-size: 16px; color: #18181b"
                        >{{email}}</a
                      >
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 8px 0; border-bottom: 1px solid #e4e4e7">
                      <strong
                        style="
                          display: block;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                          color: #71717a;
                        "
                        >Phone</strong
                      >
                      <span style="font-size: 16px">{{phone}}</span>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 8px 0; border-bottom: 1px solid #e4e4e7">
                      <strong
                        style="
                          display: block;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                          color: #71717a;
                        "
                        >Service</strong
                      >
                      <span style="font-size: 16px">{{services}}</span>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 16px 0 0">
                      <strong
                        style="
                          display: block;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                          color: #71717a;
                          margin-bottom: 8px;
                        "
                        >Message</strong
                      >
                      <p
                        style="margin: 0; font-size: 16px; line-height: 1.6; white-space: pre-wrap"
                      >
                        {{message}}
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 16px 32px 24px;
                  background-color: #fafafa;
                  border-top: 1px solid #e4e4e7;
                "
              >
                <p style="margin: 0 0 4px; font-size: 13px; color: #71717a">
                  Submitted via {{form_source}} · {{submitted_at}}
                </p>
                <p style="margin: 0; font-size: 12px; color: #a1a1aa">
                  Submitter IP: {{sender_ip}} · Reply directly to this email to reach the submitter.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
